function reconcileDirectLessonPayments(){
  // Старі вручну позначені як «Оплачено» заняття перетворюємо на реальні надходження.
  // Автооплачені з уже внесеної передоплати тут НЕ дублюємо.
  let changed=false;
  state.data.lessons.forEach(l=>{
    if(l.paid && !l.autoPaid){
      const exists=state.data.payments.some(p=>p.lessonId===l.id && p.source==='lesson');
      if(!exists){
        state.data.payments.push({id:uid(),studentId:l.studentId,amount:Number(l.price||0),date:l.paidAt||l.date||iso(new Date()),note:'Оплата заняття',source:'lesson',lessonId:l.id});
        l.paidAt=l.paidAt||l.date||iso(new Date());
        changed=true;
      }
    }
  });
  if(changed)localStorage.setItem(KEY,JSON.stringify(state.data));
}
function ensureLessonPayment(l){
  let p=state.data.payments.find(p=>p.lessonId===l.id && p.source==='lesson');
  if(!p){
    p={id:uid(),studentId:l.studentId,amount:Number(l.price||0),date:l.paidAt||iso(new Date()),note:'Оплата заняття',source:'lesson',lessonId:l.id};
    state.data.payments.push(p);
  }else{
    p.studentId=l.studentId;
    p.amount=Number(l.price||0);
    p.date=l.paidAt||p.date||iso(new Date());
  }
}

}

function student(id){return state.data.students.find(s=>s.id===id)}
function stats(id){
  const ps=state.data.payments.filter(p=>p.studentId===id);
  const ls=state.data.lessons.filter(l=>l.studentId===id);
  const received=ps.reduce((a,p)=>a+Number(p.amount||0),0);
  // Баланс змінюється тільки після статусу «Проведено».
  // Заплановані, скасовані та «Не прийшов» самі по собі передоплату не списують.
  const dueLessons=ls.filter(l=>l.status==='conducted');
  const dueTotal=dueLessons.reduce((a,l)=>a+Number(l.price||0),0);
  const paidMarked=dueLessons.filter(l=>l.paid).reduce((a,l)=>a+Number(l.price||0),0);
  const balance=received-dueTotal;
  return {received,dueTotal,spent:paidMarked,balance,debt:Math.max(0,-balance),prepaid:Math.max(0,balance),lessons:ls,payments:ps}
}
function prepayCoverage(st,z){
  const balance=Number(z?.balance||0), price=Number(st?.price||0);
  if(balance<=0 || price<=0)return '';
  const count=Math.floor(balance/price), rest=Math.round((balance-count*price)*100)/100;
  if(count<=0)return `Залишок ${money(balance)}`;
  const word=(count%10===1 && count%100!==11)?'заняття':'занять';
  return `Вистачить на ${count} ${word}${rest>0?` · залишок ${money(rest)}`:''}`;
}

function processAutoPay(){
  let changed=false;

  // Якщо автооплачене заняття повернули зі статусу «Проведено» назад,
  // звільняємо передоплату й прибираємо автоматичну позначку «Оплачено».
  state.data.lessons.forEach(l=>{
    if(l.autoPaid && l.status!=='conducted'){
      l.paid=false;
      l.autoPaid=false;
      changed=true;
    }
  });

  state.data.students.forEach(st=>{
    if(st.autoPay===false)return;

    // Автооплата працює ТІЛЬКИ для занять зі статусом «Проведено».
    // Сам факт, що час заняття минув, більше нічого не списує.
    let z=stats(st.id);
    let available=Math.max(0,z.received-z.spent);

    const eligible=state.data.lessons
      .filter(l=>l.studentId===st.id && l.status==='conducted' && !l.paid)
      .sort((a,b)=>(a.date+(a.end||'')).localeCompare(b.date+(b.end||'')));

    eligible.forEach(l=>{
      const price=Number(l.price||0);
      if(price>0 && available>=price){
        l.paid=true;
        l.autoPaid=true;
        available-=price;
        changed=true;
      }
    });
  });

  if(changed)localStorage.setItem(KEY,JSON.stringify(state.data));
}
function lessonMoment(l){
  const d=fromIso(l.date), [h,m]=(l.end||l.start||'00:00').split(':').map(Number);
  d.setHours(h||0,m||0,0,0); return d;
}

function isVacationDate(date,classId){
  return (state.data.vacations||[]).some(v=>{
    if(date<v.start || date>v.end)return false;
    // Старі періоди без classIds вважаємо канікулами для всіх класів.
    if(!Array.isArray(v.classIds) || !v.classIds.length)return true;
    return v.classIds.includes(classId);
  });
}
function vacationClassLabel(v){
  if(!Array.isArray(v.classIds) || !v.classIds.length)return 'Усі класи';
  const names=v.classIds.map(id=>state.data.schoolClasses.find(c=>c.id===id)?.name).filter(Boolean);
  return names.length?names.join(', '):'Обрані класи';
}

  const rows=[...(state.data.vacations||[])].sort((a,b)=>a.start.localeCompare(b.start)).map(v=>`<div class="history"><div><div class="h1">${esc(v.name||'Шкільні канікули')}</div><div class="h2">${fmt(v.start)} — ${fmt(v.end)}</div><div class="h2">${esc(vacationClassLabel(v))}</div></div><button class="trash" data-del-vac="${v.id}" aria-label="Видалити">🗑</button></div>`).join('');
  const classChoices=classes.map(cl=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)"><input type="checkbox" data-vac-class value="${cl.id}" checked style="width:20px;height:20px;accent-color:var(--accent)"><span style="font-weight:700">${esc(cl.name)}</span></label>`).join('');
  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">Шкільні канікули</div></div>
    <div class="mbody">
      <div class="summary">Обери, для яких класів діють ці канікули. Це зручно, якщо класи з різних шкіл мають різні дати. Репетиторські заняття не змінюються.</div>
      <div><label>Назва</label><input id="vacName" placeholder="Напр. Осінні канікули"></div>
      <div><label>Від</label><input id="vacStart" type="date" value="${today}"></div>
      <div><label>До</label><input id="vacEnd" type="date" value="${today}"></div>
      <div><label>Класи</label><div style="border:1px solid var(--line);border-radius:14px;padding:0 12px;background:#fff">${classChoices}</div>
        <div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="choiceBtn" id="vacAll" style="padding:9px 12px">Вибрати всі</button><button type="button" class="choiceBtn" id="vacNone" style="padding:9px 12px">Очистити</button></div>
      </div>
      <button class="primary" id="saveVacation">Додати канікули</button>
      ${rows?`<div class="section">Збережені канікули</div>${rows}`:''}
    </div>`;
  openModal(m,'vacations');
  m.querySelector('.close').onclick=()=>closeModal(m);
  document.getElementById('vacAll').onclick=()=>m.querySelectorAll('[data-vac-class]').forEach(x=>x.checked=true);
  document.getElementById('vacNone').onclick=()=>m.querySelectorAll('[data-vac-class]').forEach(x=>x.checked=false);
  document.getElementById('saveVacation').onclick=()=>{
    const start=document.getElementById('vacStart').value,end=document.getElementById('vacEnd').value;
    if(!start||!end)return alert('Обери початок і кінець.');
    if(end<start)return alert('Дата завершення не може бути раніше початку.');
    const classIds=[...m.querySelectorAll('[data-vac-class]:checked')].map(x=>x.value);
    if(!classIds.length)return alert('Обери хоча б один клас.');
    state.data.vacations.push({id:uid(),name:document.getElementById('vacName').value.trim()||'Шкільні канікули',start,end,classIds});
    save(); m.classList.remove('open'); history.replaceState({tab:state.tab},''); render();
  };
  m.querySelectorAll('[data-del-vac]').forEach(b=>b.onclick=()=>{
    if(!confirm('Видалити ці канікули? Уроки вибраних класів знову з’являться у календарі.'))return;
    state.data.vacations=state.data.vacations.filter(v=>v.id!==b.dataset.delVac);
    save(); openVacations(today); render();
  });
}
function renderStudents(){
  document.getElementById('topbar').innerHTML='';
  const q=studentListView.query.trim().toLowerCase();
  const activeStudents=state.data.students.filter(st=>!st.archived);
  let list=state.data.students.filter(st=>{
    if(studentListView.filter==='archive') return !!st.archived;
    if(st.archived) return false;
    const z=stats(st.id);
    if(studentListView.filter==='debt' && !(z.balance<0)) return false;
    if(studentListView.filter==='prepaid' && !(z.balance>0)) return false;
    return true;
  });
  if(q) list=list.filter(st=>`${st.name||''} ${st.cls||''}`.toLowerCase().includes(q));
  let rows=list.map(st=>{
    const z=stats(st.id), bc=z.balance>0?'var(--good)':z.balance<0?'var(--bad)':'#555';
    return `<button class="studentRow" data-id="${st.id}">
      <span class="dot" style="background:${st.color}"></span>
      <span class="smain"><span class="sname">${esc(st.name)}</span><span class="ssub">${esc(st.cls||'Без класу')} · ${money(st.price)}</span>${st.archived?'<span class="archiveBadge">В архіві</span>':''}</span>
      <span class="sright"><span class="bal" style="color:${bc}">${z.balance>0?'+':''}${money(z.balance)}</span>${z.balance>0?`<span class="unpaid">${esc(prepayCoverage(st,z))}</span>`:''}</span>
    </button>`
  }).join('');
  const filters=[['all','Усі'],['debt','Борг'],['prepaid','Передоплата'],['archive','Архів']];
  const emptyMsg=studentListView.filter==='archive'?'Архів порожній':q?'Нічого не знайдено':studentListView.filter==='debt'?'Немає учнів із боргом':studentListView.filter==='prepaid'?'Немає учнів із передоплатою':'Учнів ще немає';
  document.getElementById('main').innerHTML=`<div class="students">
    <div class="studentTop"><div><h1>Учні</h1><div class="summary">${activeStudents.length} ${activeStudents.length===1?'учень':'учнів'}</div></div><div class="headerActions"><button class="fab" id="addStudent">+</button><button class="moreBtn" id="appMenuBtn" aria-label="Меню">⋮</button></div></div>
    <div class="studentTools"><input class="studentSearch" id="studentSearch" type="search" placeholder="Пошук учня" value="${esc(studentListView.query)}"><div class="studentFilters">${filters.map(([id,label])=>`<button class="filterChip ${studentListView.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div></div>
    ${rows || `<div class="emptyState" style="height:55vh"><b>${emptyMsg}</b><span>${studentListView.filter==='archive'?'Архівовані учні з’являться тут.':q?'Спробуй інше ім’я або клас.':'Натисни «+», щоб додати учня.'}</span></div>`}
  </div>`;
  document.getElementById('addStudent').onclick=()=>openStudent();
  document.getElementById('appMenuBtn').onclick=()=>openAppMenu();
  const search=document.getElementById('studentSearch');
  search.oninput=e=>{
    studentListView.query=e.target.value;
    const pos=e.target.selectionStart;
    renderStudents();
    const s=document.getElementById('studentSearch');
    if(s){s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}}
  };
  document.querySelectorAll('.filterChip').forEach(b=>b.onclick=()=>{studentListView.filter=b.dataset.filter;renderStudents()});
  document.querySelectorAll('.studentRow').forEach(b=>b.onclick=()=>openCard(b.dataset.id));
}

    <span class="smain"><span class="sname">${esc(cl.name)}</span><span class="subjectChips">${(cl.subjects||[]).map(s=>`<span class="subjectChip" style="background:${s.color};color:${contrastText(s.color)}">${esc(s.name)}</span>`).join('')||'<span class="ssub">Предметів ще немає</span>'}</span></span>

    ${rows||'<div class="emptyState"><b>Класів ще немає</b><span>Додай клас, а в ньому — предмети, кольори та формат уроків.</span></div>'}

function openClassEditor(cl=null){
  const m=document.getElementById('cardModal');
  const subjects=(cl?.subjects?.length?cl.subjects:[{id:uid(),name:'',color:'#8b5cf6',mode:'inperson'}]).map(s=>({...s}));
  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">${cl?'Редагувати клас':'Додати клас'}</div>${cl?'<button class="trash">🗑</button>':''}</div>
    <div class="mbody">
      <div><label>Назва класу</label><input id="className" value="${esc(cl?.name||'')}" placeholder="Напр. 7-А"></div>
      <div><label>Предмети</label><div id="subjectsBox"></div></div>
      <button class="choiceBtn" id="addSubject">+ Додати предмет</button>
      <button class="primary" id="saveClass">Зберегти клас</button>
    </div>`;
  openModal(m,'class');
  m.querySelector('.close').onclick=()=>closeModal(m);
  const drawSubjects=()=>{
    document.getElementById('subjectsBox').innerHTML=subjects.map((s,i)=>`<div class="subjectEditor" data-i="${i}">
      <div class="subjectHead"><b>Предмет ${i+1}</b>${subjects.length>1?`<button class="miniDelete" data-del="${i}">Видалити</button>`:''}</div>
      <div><label>Назва</label><input class="subName" data-i="${i}" value="${esc(s.name)}" placeholder="Алгебра"></div>
      <div class="row2" style="margin-top:10px"><div><label>Колір</label><div class="colorSelectWrap"><span class="colorPreview" data-preview="${i}" style="background:${s.color||'#8b5cf6'}"></span><select class="subColor" data-i="${i}">${colorOptionsHtml(s.color||'#8b5cf6')}</select></div></div>
      <div><label>За замовчуванням</label><select class="subMode" data-i="${i}"><option value="inperson" ${s.mode!=='remote'?'selected':''}>Очно</option><option value="remote" ${s.mode==='remote'?'selected':''}>Дистанційно</option></select></div></div>
    </div>`).join('');
    document.querySelectorAll('.subName').forEach(x=>x.oninput=e=>subjects[+e.target.dataset.i].name=e.target.value);
    document.querySelectorAll('.subColor').forEach(x=>x.onchange=e=>{const i=+e.target.dataset.i;subjects[i].color=e.target.value;const p=document.querySelector(`[data-preview="${i}"]`);if(p)p.style.background=e.target.value});
    document.querySelectorAll('.subMode').forEach(x=>x.onchange=e=>subjects[+e.target.dataset.i].mode=e.target.value);
    document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{subjects.splice(+x.dataset.del,1);drawSubjects()});
  };
  drawSubjects();
  document.getElementById('addSubject').onclick=()=>{subjects.push({id:uid(),name:'',color:'#3b82f6',mode:'inperson'});drawSubjects()};
  if(cl)m.querySelector('.trash').onclick=()=>{
    if(confirm('Видалити цей клас і всі його шкільні уроки?')){
      state.data.schoolClasses=state.data.schoolClasses.filter(x=>x.id!==cl.id);
      state.data.schoolLessons=state.data.schoolLessons.filter(x=>x.classId!==cl.id);
      save(); m.classList.remove('open'); history.replaceState({tab:state.tab},''); render();
    }
  };
  document.getElementById('saveClass').onclick=()=>{
    const name=document.getElementById('className').value.trim();
    if(!name)return alert('Введи назву класу');
    const cleaned=subjects.map(s=>({...s,name:s.name.trim()})).filter(s=>s.name);
    if(!cleaned.length)return alert('Додай хоча б один предмет');
    const obj={id:cl?.id||uid(),name,subjects:cleaned};
    if(cl) state.data.schoolClasses=state.data.schoolClasses.map(x=>x.id===cl.id?obj:x);
    else state.data.schoolClasses.push(obj);
    save();m.classList.remove('open');history.replaceState({tab:state.tab},'');render();
  };
}

function renderFinance(){
  state.financeMode ||= 'month';
  state.financeDate ||= iso(new Date()).slice(0,7);
  const [fy,fm]=state.financeDate.split('-').map(Number);
  const mode=state.financeMode;
  const periodMatch=date=>{
    const d=String(date||'');
    return mode==='month' ? d.slice(0,7)===state.financeDate : d.slice(0,4)===String(fy);
  };
  const periodPayments=state.data.payments.filter(p=>periodMatch(p.date));
  const tutor=periodPayments.reduce((a,p)=>a+Number(p.amount||0),0);
  const inc=state.data.income.filter(x=>periodMatch(x.date));
  const salary=inc.filter(x=>x.type==='salary').reduce((a,x)=>a+Number(x.amount||0),0);
  const advance=inc.filter(x=>x.type==='advance').reduce((a,x)=>a+Number(x.amount||0),0);
  const other=inc.filter(x=>x.type==='other').reduce((a,x)=>a+Number(x.amount||0),0);
  const schoolIncome=salary+advance+other, total=tutor+schoolIncome;
  const prepaid=state.data.students.reduce((a,s)=>a+stats(s.id).prepaid,0);
  const expected=state.data.students.reduce((a,s)=>a+stats(s.id).debt,0);
  const periodLessons=state.data.lessons.filter(l=>periodMatch(l.date));
  const conducted=periodLessons.filter(l=>l.status==='conducted');
  const plannedLessons=periodLessons.filter(l=>(l.status||'planned')==='planned');
  const earningPlanLessons=periodLessons.filter(l=>l.status!=='cancelled');
  const possibleEarnings=earningPlanLessons.reduce((a,l)=>a+Number(l.price||0),0);
  const remainingPlanValue=plannedLessons.reduce((a,l)=>a+Number(l.price||0),0);
  const conductedValue=conducted.reduce((a,l)=>a+Number(l.price||0),0);
  const avgLesson=conducted.length?conductedValue/conducted.length:0;
  const schoolCount=state.data.schoolLessons.filter(l=>periodMatch(l.date) && !isVacationDate(l.date,l.classId)).length;
  const byStudent=state.data.students.map(st=>({name:st.name,amount:periodPayments.filter(p=>p.studentId===st.id).reduce((a,p)=>a+Number(p.amount||0),0)})).filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);
  const maxStudent=Math.max(1,...byStudent.map(x=>x.amount));
  const monthly=Array.from({length:12},(_,i)=>{
    const ym=`${fy}-${pad(i+1)}`;
    const tp=state.data.payments.filter(p=>String(p.date||'').slice(0,7)===ym).reduce((a,p)=>a+Number(p.amount||0),0);
    const si=state.data.income.filter(x=>String(x.date||'').slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);
    return {v:tp+si,label:MONTHS[i].slice(0,3)};
  });
  const maxMonth=Math.max(1,...monthly.map(x=>x.v));
  const tutorPct=total>0?tutor/total*100:0;
  const history=[
    ...state.data.payments.filter(p=>periodMatch(p.date)).map(p=>({date:p.date,amount:Number(p.amount||0),label:`Репетиторство · ${student(p.studentId)?.name||'Учень'}${p.source==='lesson'?' · заняття':''}`})),
    ...state.data.income.filter(x=>periodMatch(x.date)).map(x=>({date:x.date,amount:Number(x.amount||0),label:x.type==='salary'?'Зарплата':x.type==='advance'?'Аванс':x.note||'Інший дохід'}))
  ].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,30);
  const periodTitle=mode==='month'?`${MONTHS[fm-1]} ${fy}`:`${fy} рік`;
  document.getElementById('topbar').innerHTML='';
  document.getElementById('main').innerHTML=`<div class="finance">
    <div class="finHead"><div class="finMonth"><b>Фінанси</b><button class="moreBtn" id="appMenuBtn" aria-label="Меню">⋮</button></div>
      <div class="finPeriodNav"><button id="finPrev">‹</button><div class="finPeriodLabel">${periodTitle}</div><button id="finNext">›</button></div>
      <div class="finTotal">${money(total)}</div><div class="summary">Отриманий дохід за ${mode==='month'?'період':'рік'}</div></div>
    <div class="finToggle"><button data-finmode="month" class="${mode==='month'?'active':''}">Місяць</button><button data-finmode="year" class="${mode==='year'?'active':''}">Рік</button></div>
    <div class="earningForecast">
      <div class="earningForecastTitle">${mode==='month'?'План заробітку за місяць':'План заробітку за рік'}</div>
      <div class="earningForecastMain">${money(possibleEarnings)}</div>
      <div class="earningForecastSub">${earningPlanLessons.length} занять у розкладі · скасовані не враховуються</div>
      <div class="earningForecastGrid">
        <div class="earningForecastMini"><small>Проведено</small><b>${conducted.length} · ${money(conductedValue)}</b></div>
        <div class="earningForecastMini"><small>Залишилось за планом</small><b>${plannedLessons.length} · ${money(remainingPlanValue)}</b></div>
      </div>
    </div>
    <div class="finGrid">
      <div class="finCol">
        <div class="finColTitle">Репетиторство</div>
        <div class="finCard"><small>Отримано</small><b>${money(tutor)}</b></div>
        <div class="finCard"><small>Передоплати учнів</small><b>${money(prepaid)}</b></div>
        <div class="finCard"><small>Борги учнів</small><b>${money(expected)}</b></div>
        <div class="finCard"><small>Проведено занять</small><b>${conducted.length}</b></div>
      </div>
      <div class="finCol">
        <div class="finColTitle">Школа</div>
        <div class="finCard"><small>Усього</small><b>${money(schoolIncome)}</b></div>
        <div class="finCard"><small>Зарплата</small><b>${money(salary)}</b></div>
        <div class="finCard"><small>Аванс</small><b>${money(advance)}</b></div>
        <div class="finCard"><small>Інше</small><b>${money(other)}</b></div>
      </div>
    </div>
    <div class="analytics">
      <div class="analyticsBox"><div class="analyticsTitle">Аналітика</div><div class="metricGrid">
        <div class="metric"><small>Середня вартість проведеного заняття</small><b>${money(avgLesson)}</b></div>
        <div class="metric"><small>Шкільних уроків у розкладі</small><b>${schoolCount}</b></div>
      </div></div>
      <div class="analyticsBox"><div class="analyticsTitle">Школа / репетиторство</div>
        <div class="splitBar"><div class="splitTutor" style="width:${tutorPct}%"></div><div class="splitSchool" style="width:${100-tutorPct}%"></div></div>
        <div class="splitLegend"><span>Репетиторство ${money(tutor)}</span><span>Школа ${money(schoolIncome)}</span></div>
      </div>
      <div class="analyticsBox"><div class="analyticsTitle">Дохід по учнях</div>${byStudent.length?byStudent.map(x=>`<div class="studentIncomeRow"><div class="studentIncomeName">${esc(x.name)}</div><div class="studentIncomeTrack"><div class="studentIncomeFill" style="width:${x.amount/maxStudent*100}%"></div></div><div class="studentIncomeAmt">${money(x.amount)}</div></div>`).join(''):'<div class="analyticsEmpty">За цей період оплат від учнів немає</div>'}</div>
      <div class="analyticsBox"><div class="analyticsTitle">Динаміка доходу · ${fy}</div><div class="chart">${monthly.map(x=>`<div class="chartCol"><div class="chartVal">${x.v?Math.round(x.v/1000*10)/10+'к':''}</div><div class="chartBar" style="height:${Math.max(2,x.v/maxMonth*105)}px"></div><div class="chartLab">${x.label}</div></div>`).join('')}</div></div>
    </div>
    <div class="finActions"><button class="primary" id="addIncome">+ Додати дохід</button></div>
    <div class="finHistory"><div class="finTitle">Надходження за період</div>${history.length?history.map(x=>`<div class="history"><div><div class="h1">${esc(x.label)}</div><div class="h2">${fmt(x.date)}</div></div><b style="color:var(--good)">+${money(x.amount)}</b></div>`).join(''):'<div class="empty">Надходжень за цей період немає</div>'}</div>
  </div>`;
  document.getElementById('addIncome').onclick=openIncome;
  document.getElementById('appMenuBtn').onclick=()=>openAppMenu();
  document.querySelectorAll('[data-finmode]').forEach(b=>b.onclick=()=>{state.financeMode=b.dataset.finmode;renderFinance()});
  const shift=dir=>{let y=fy,m=fm;if(mode==='month'){m+=dir;if(m<1){m=12;y--}if(m>12){m=1;y++}}else y+=dir;state.financeDate=`${y}-${pad(m)}`;renderFinance()};
  document.getElementById('finPrev').onclick=()=>shift(-1);document.getElementById('finNext').onclick=()=>shift(1);
}

  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">Додати дохід</div></div><div class="mbody">
    <div><label>Тип</label><select id="incType"><option value="salary">Зарплата</option><option value="advance">Аванс</option><option value="other">Інший дохід</option></select></div>
    <div><label>Сума</label><input id="incAmount" type="number" placeholder="0"></div>
    <div><label>Дата</label><input id="incDate" type="date" value="${iso(new Date())}"></div>
    <div><label>Коментар</label><input id="incNote" placeholder="Необов’язково"></div>
    <button class="primary" id="saveIncome">Зберегти</button></div>`;

function openAppMenu(){
  const m=document.getElementById('choiceModal');
  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">Меню</div></div>
  <div class="mbody">
    <div class="menuList">
      <button class="menuItem" id="reportsMenu">📄 Звіти<small>Простий звіт, ФОП і всі доходи</small></button>

async function shareApp(){
  const url=location.origin+location.pathname;
  try{
    if(navigator.share){
      await navigator.share({title:'Мій репетитор',text:'Застосунок для розкладу школи та репетиторства',url});
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(url);
      alert('Посилання скопійовано.');
    }else{
      prompt('Скопіюй посилання:',url);
    }
  }catch(e){
    if(e && e.name!=='AbortError') alert('Не вдалося поділитися. Спробуй ще раз.');
  }
}

function exportBackup(){
  save();
  const backup={
    app:'Мій репетитор',
    version:APP_VERSION,
    exportedAt:new Date().toISOString(),
    data:state.data
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const stamp=iso(new Date());
  a.href=URL.createObjectURL(blob);

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

function validBackupData(d){
  return d && typeof d==='object' && Array.isArray(d.students) && Array.isArray(d.lessons) && Array.isArray(d.payments) && Array.isArray(d.income) && Array.isArray(d.schoolLessons);
}

async function importBackupFile(file){
  if(!file)return;
  try{
    const raw=await file.text();
    const parsed=JSON.parse(raw);
    const data=parsed?.data||parsed;
    if(!validBackupData(data))throw new Error('bad backup');
    const counts=`Учні: ${data.students.length}\nРепетиторські заняття: ${data.lessons.length}\nШкільні уроки: ${data.schoolLessons.length}`;
    if(!confirm(`Відновити цю резервну копію?\n\n${counts}\n\nПоточні дані в застосунку буде замінено даними з копії.`))return;
    state.data=JSON.parse(JSON.stringify(data));
    normalizeData();
    save();
    reconcileDirectLessonPayments();
    closeAllModals();
    history.replaceState({tab:state.tab},'');
    render();
    alert('Резервну копію відновлено.');
  }catch(e){
    alert('Не вдалося прочитати резервну копію. Обери JSON-файл, створений у «Моєму репетиторі».');
  }finally{
    document.getElementById('backupInput').value='';
  }
}

document.getElementById('backupInput').addEventListener('change',e=>importBackupFile(e.target.files?.[0]));


function repeatUntilDefault(dateStr){

}
function repeatDates(startDate,untilDate){
  const out=[]; let d=fromIso(startDate), end=fromIso(untilDate);
  while(d<=end){out.push(iso(d));d=addDays(d,7)}
  return out;
}

function editTutorSeries(old,obj,parent){
  parent.classList.remove('open');history.replaceState({tab:state.tab},'');
  chooseSeries('Змінити повторюване заняття',scope=>{
    const items=state.data.lessons.filter(x=>x.seriesId===old.seriesId);
    if(scope==='one'){
      state.data.lessons=state.data.lessons.map(x=>x.id===old.id?{...obj,seriesId:null}:x);
    }else if(scope==='following'){
      const base=fromIso(obj.date), oldBase=fromIso(old.date);
      items.filter(x=>x.date>=old.date).forEach(x=>{
        const weeks=Math.round((fromIso(x.date)-oldBase)/(7*86400000));
        Object.assign(x,{studentId:obj.studentId,price:obj.price,mode:obj.mode,start:obj.start,end:obj.end,note:obj.note,date:iso(addDays(base,weeks*7))});
        if(x.id===old.id){x.paid=obj.paid;x.autoPaid=obj.autoPaid;x.status=obj.status}
      });
    }else{
      const delta=Math.round((fromIso(obj.date)-fromIso(old.date))/86400000);
      items.forEach(x=>{x.studentId=obj.studentId;x.price=obj.price;x.mode=obj.mode;x.start=obj.start;x.end=obj.end;x.note=obj.note;x.date=iso(addDays(fromIso(x.date),delta))});
      const clicked=state.data.lessons.find(x=>x.id===old.id);if(clicked){clicked.paid=obj.paid;clicked.autoPaid=obj.autoPaid;clicked.status=obj.status}
    }
    save();render();
  });
}
function editSchoolSeries(old,obj,parent){

      });
    }else{
      const delta=Math.round((fromIso(obj.date)-fromIso(old.date))/86400000);
      items.forEach(x=>{x.classId=obj.classId;x.subjectId=obj.subjectId;x.mode=obj.mode;x.start=obj.start;x.end=obj.end;x.note=obj.note;x.date=iso(addDays(fromIso(x.date),delta))});

function deleteTutorLesson(l,parent){
  if(!l.seriesId){
    if(confirm('Видалити це заняття?')){removeLessonPayment(l.id);state.data.lessons=state.data.lessons.filter(x=>x.id!==l.id);save();finishModalSave(parent)}
    return;
  }
  parent.classList.remove('open');history.replaceState({tab:state.tab},'');
  chooseSeries('Видалити повторюване заняття',scope=>{
    const doomed=state.data.lessons.filter(x=>scope==='one'?x.id===l.id:scope==='following'?(x.seriesId===l.seriesId&&x.date>=l.date):x.seriesId===l.seriesId).map(x=>x.id);
    doomed.forEach(removeLessonPayment);
    if(scope==='one')state.data.lessons=state.data.lessons.filter(x=>x.id!==l.id);
    if(scope==='following')state.data.lessons=state.data.lessons.filter(x=>!(x.seriesId===l.seriesId&&x.date>=l.date));
    if(scope==='all')state.data.lessons=state.data.lessons.filter(x=>x.seriesId!==l.seriesId);
    save();render();
  });
}

  m.querySelectorAll('[data-del-pay]').forEach(b=>b.onclick=()=>{const p=state.data.payments.find(x=>x.id===b.dataset.delPay);if(!p)return;if(!confirm(`Видалити оплату ${money(p.amount)} від ${fmt(p.date)}?`))return;state.data.payments=state.data.payments.filter(x=>x.id!==p.id);if(p.source==='lesson'&&p.lessonId){const l=state.data.lessons.find(x=>x.id===p.lessonId);if(l){l.paid=false;l.autoPaid=false;l.paidAt=null}}save();m.classList.remove('open');openCard(id);render()});
  const drawStudentStats=()=>{const ym=document.getElementById('studentStatMonth').value,arr=z.lessons.filter(l=>String(l.date).slice(0,7)===ym),conducted=arr.filter(l=>l.status==='conducted').length,cancelled=arr.filter(l=>l.status==='cancelled').length,noShow=arr.filter(l=>l.status==='no_show').length,planned=arr.filter(l=>l.status==='planned').length,decided=conducted+noShow,attendance=decided?Math.round(conducted/decided*100):0,paidMonth=z.payments.filter(p=>String(p.date).slice(0,7)===ym).reduce((a,p)=>a+Number(p.amount||0),0);document.getElementById('studentStatBox').innerHTML=`<div class="reportSection"><div class="reportRow"><span>Заплановано</span><b>${planned}</b></div><div class="reportRow"><span>Проведено</span><b>${conducted}</b></div><div class="reportRow"><span>Не прийшов</span><b>${noShow}</b></div><div class="reportRow"><span>Скасовано</span><b>${cancelled}</b></div><div class="reportRow"><span>Відвідуваність</span><b>${attendance}%</b></div><div class="reportRow"><span>Отримано оплат</span><b>${money(paidMonth)}</b></div><div class="reportRow"><span>Поточний баланс</span><b>${z.balance>0?'+':''}${money(z.balance)}</b></div></div>`};document.getElementById('studentStatMonth').onchange=drawStudentStats;drawStudentStats();
  document.getElementById('addPay').onclick=()=>{const a=Number(document.getElementById('payAmount').value||0);if(a<=0)return alert('Введи суму');state.data.payments.push({id:uid(),studentId:id,amount:a,date:iso(new Date()),note:document.getElementById('payNote').value.trim()});save();m.classList.remove('open');openCard(id);render()};
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v='+APP_VERSION,{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; document.getElementById('installBar').classList.add('show');
});
document.getElementById('installNow').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBar').classList.remove('show');
};
document.getElementById('installClose').onclick=()=>document.getElementById('installBar').classList.remove('show');

normalizeData();
reconcileDirectLessonPayments();
render();
</script>
</body>
</html>
