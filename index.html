<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c4cff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Мій репетитор</title>
<style>
:root{
  --bg:#f7f7fb;--card:#fff;--text:#17171b;--muted:#868692;--line:#e8e8ef;
  --accent:#6c4cff;--good:#159947;--bad:#d74747;--hour:66px;--timew:34px;
  --dayw:calc((100vw - var(--timew)) / 7)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:#fff}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.top{padding:9px 10px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff}
.month{font-size:22px;font-weight:850;line-height:1.05}
.weeknav{display:flex;align-items:center;gap:2px;margin-top:4px;font-size:12px;color:#666}
.iconbtn{border:0;background:transparent;font-size:24px;line-height:1;padding:2px 6px}
.money{font-size:11px;color:var(--muted);text-align:right;margin-bottom:5px;white-space:nowrap}
.money b{color:var(--text);font-size:13px}
.fab{border:0;background:var(--accent);color:#fff;width:38px;height:38px;border-radius:50%;font-size:25px;line-height:38px;box-shadow:0 4px 12px #6c4cff33}
.main{flex:1;min-height:0;overflow:hidden}
.tabs{height:70px;border-top:1px solid var(--line);display:flex;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:#fff;color:#777;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:11px;min-width:0;padding:0 2px}
.tab b{font-size:20px;font-weight:600}
.tab.active{color:var(--accent);font-weight:700}
.calendarWrap{height:100%;overflow:auto;background:#fff}
.calendar{width:100%;min-width:100%}
.dayheads{display:flex;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.timeHead{width:var(--timew);flex:0 0 var(--timew)}
.dayhead{width:var(--dayw);flex:0 0 var(--dayw);height:50px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.dayhead .n{font-weight:800;font-size:14px}.dayhead .d{font-size:10px;color:var(--muted);margin-top:1px}
.gridrow{display:flex;position:relative}
.times{width:var(--timew);flex:0 0 var(--timew)}
.time{height:var(--hour);border-bottom:1px solid var(--line);font-size:9px;color:#888;text-align:right;padding:3px 3px 0 0}
.daycol{position:relative;width:var(--dayw);flex:0 0 var(--dayw);height:calc(var(--hour) * 15);border-left:1px solid var(--line)}
.hourline{height:var(--hour);border-bottom:1px solid var(--line)}
.lesson{position:absolute;left:2px;right:2px;border:0;border-radius:5px;padding:4px 3px;text-align:left;color:#fff;overflow:hidden;box-shadow:0 1px 2px #0002}
.lesson .name{font-size:10px;font-weight:850;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .meta{font-size:8.5px;font-weight:750;margin-top:3px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:clip}.lesson.school{color:#fff}.lesson .mode{font-size:8px;margin-top:2px;opacity:.95}
.lesson .paidmark{font-size:10px;font-weight:900;float:right;margin-left:2px}
.students{height:100%;overflow:auto;background:var(--bg)}
.studentTop{padding:16px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.studentTop h1{margin:0;font-size:25px}.summary{font-size:12px;color:var(--muted);margin-top:5px}
.studentRow{background:#fff;border:0;border-bottom:1px solid var(--line);width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.smain{flex:1;min-width:0}.sname{font-weight:800;display:block}.ssub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.sright{text-align:right}.bal{font-weight:800}.unpaid{font-size:11px;color:var(--muted);margin-top:3px}
.emptyState{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted)}
.emptyState b{color:var(--text);font-size:20px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}
.modal.open{display:flex}
.mhead{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}
.mhead .title{font-size:19px;font-weight:800;flex:1}.close,.trash{border:0;background:transparent;font-size:26px}
.mbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fafafa;padding:12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-weight:800}
.switchrow,.paybox{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}
.pill{border:0;border-radius:999px;padding:9px 12px;font-weight:800}
.palette{display:flex;flex-wrap:wrap;gap:10px}.c{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.c.sel{border-color:#222}
.bigbal{font-size:34px;font-weight:900}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#f4f4f8;border-radius:12px;padding:12px}.mini small{color:var(--muted)}.mini b{display:block;font-size:18px;margin-top:4px}
.section{font-size:17px;font-weight:800;margin-top:8px}.history{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.history .h1{font-weight:700;font-size:13px}.history .h2{color:var(--muted);font-size:12px;margin-top:3px}.empty{text-align:center;color:var(--muted);padding:20px 0}
.installBar{display:none;position:fixed;left:12px;right:12px;bottom:82px;z-index:80;background:#17171b;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px #0003;align-items:center;gap:10px}
.installBar.show{display:flex}.installBar span{flex:1;font-size:13px}.installBar button{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.installNow{background:#fff;color:#17171b}.installClose{background:transparent;color:#fff;font-size:20px}
@media(max-width:380px){:root{--timew:31px}.month{font-size:20px}.weeknav{font-size:11px}.lesson .name{font-size:9px}.lesson .meta{font-size:8px}}

.finance{height:100%;overflow:auto;background:var(--bg);padding-bottom:24px}
.finHead{background:#fff;padding:16px;border-bottom:1px solid var(--line)}
.finMonth{display:flex;align-items:center;justify-content:space-between}
.finTotal{font-size:34px;font-weight:900;margin-top:10px}
.finGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.finCard{background:#fff;border-radius:14px;padding:14px}
.finCard small{color:var(--muted)}.finCard b{display:block;font-size:19px;margin-top:5px}
.finActions{padding:0 12px 12px}.finActions .primary{width:100%}
.finHistory{background:#fff;padding:0 16px}.finTitle{font-size:18px;font-weight:850;padding:14px 0 6px}


.classes{height:100%;overflow:auto;background:var(--bg)}
.classRow{background:#fff;border:0;border-bottom:1px solid var(--line);width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.classBadge{min-width:48px;height:38px;border-radius:10px;background:#f0edff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;padding:0 8px}
.subjectChips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.subjectChip{font-size:10px;border-radius:999px;padding:4px 7px;color:#fff;font-weight:800}
.subjectEditor{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafafa}
.subjectEditor + .subjectEditor{margin-top:10px}
.subjectHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.subjectHead b{font-size:14px}.miniDelete{border:0;background:#fee2e2;color:#b91c1c;border-radius:9px;padding:7px 9px;font-weight:800}
.colorInput{padding:3px;height:46px}
.choiceBox{display:flex;flex-direction:column;gap:10px}
.choiceBtn{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;font-weight:800}
.choiceBtn small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.dangerBtn{color:#b91c1c;border-color:#fecaca;background:#fff7f7}
.typeChoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typeCard{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 10px;font-weight:850;text-align:center}
.typeCard span{display:block;font-size:26px;margin-bottom:8px}
.repeatUntil{display:none;margin-top:10px}

</style>
</head>
<body>
<div class="app">
  <div id="topbar" class="top"></div>
  <div id="main" class="main"></div>
  <div class="tabs">
    <button class="tab active" data-tab="calendar"><b>▣</b>Календар</button>
    <button class="tab" data-tab="students"><b>●</b>Учні</button>
    <button class="tab" data-tab="classes"><b>▦</b>Класи</button>
    <button class="tab" data-tab="finance"><b>₴</b>Фінанси</button>
  </div>
</div>

<div id="installBar" class="installBar">
  <span>Можна встановити «Мій репетитор» як окремий застосунок.</span>
  <button class="installNow" id="installNow">Встановити</button>
  <button class="installClose" id="installClose">×</button>
</div>

<div id="lessonModal" class="modal"></div>
<div id="studentModal" class="modal"></div>
<div id="cardModal" class="modal"></div>
<div id="choiceModal" class="modal"></div>

<script>
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const GEN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const HSTART=8,HEND=23,HOURPX=66;
const KEY='miy_repetytor_v4_2_2';
const TABKEY='miy_repetytor_active_tab';
const APP_VERSION='4.2.1';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const startWeek=d=>{let x=new Date(d);x.setHours(0,0,0,0);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x};
const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
const money=n=>`${Math.round(Number(n)||0).toLocaleString('uk-UA')} ₴`;
const fmt=s=>{let d=fromIso(s);return `${d.getDate()} ${GEN[d.getMonth()]} ${d.getFullYear()}`};

let state={tab:localStorage.getItem(TABKEY)||'calendar',week:startWeek(new Date()),data:load()};
function load(){
  try{
    let x=JSON.parse(localStorage.getItem(KEY)||'null');
    if(x)return x;
    // Якщо користувач уже щось вніс у попередню чисту версію — забираємо дані звідти.
    let old=JSON.parse(localStorage.getItem('miy_repetytor_v4_2_1')||'null')
      || JSON.parse(localStorage.getItem('miy_repetytor_v4_2')||'null')
      || JSON.parse(localStorage.getItem('miy_repetytor_v4')||'null')
      || JSON.parse(localStorage.getItem('miy_repetytor_v3')||'null')
      || JSON.parse(localStorage.getItem('miy_repetytor_v2_clean')||'null');
    if(old)return old;
  }catch(e){}
  return {students:[],lessons:[],payments:[],income:[],schoolLessons:[]}
}
function normalizeData(){
  state.data.students ||= [];
  state.data.lessons ||= [];
  state.data.payments ||= [];
  state.data.income ||= [];
  state.data.schoolLessons ||= [];
  state.data.schoolClasses ||= [];
  state.data.students.forEach(s=>{ if(s.autoPay===undefined) s.autoPay=true; });
  state.data.lessons.forEach(l=>{ if(l.seriesId===undefined) l.seriesId=null; });
  state.data.schoolLessons.forEach(l=>{ if(l.seriesId===undefined) l.seriesId=null; });
}
function save(){normalizeData();localStorage.setItem(KEY,JSON.stringify(state.data))}
function student(id){return state.data.students.find(s=>s.id===id)}
function stats(id){
  const ps=state.data.payments.filter(p=>p.studentId===id);
  const ls=state.data.lessons.filter(l=>l.studentId===id);
  const received=ps.reduce((a,p)=>a+Number(p.amount||0),0);
  const now=new Date();
  const dueLessons=ls.filter(l=>lessonMoment(l)<=now);
  const dueTotal=dueLessons.reduce((a,l)=>a+Number(l.price||0),0);
  const paidMarked=dueLessons.filter(l=>l.paid).reduce((a,l)=>a+Number(l.price||0),0);
  // Єдиний баланс учня: отримані гроші мінус усі заняття, що вже відбулися.
  // + = передоплата, 0 = розраховано, - = борг.
  const balance=received-dueTotal;
  return {received,dueTotal,spent:paidMarked,balance,debt:Math.max(0,-balance),prepaid:Math.max(0,balance),lessons:ls,payments:ps}
}
function closeAllModals(){
  document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));
}
function setTab(tab,push=true){
  state.tab=tab; localStorage.setItem(TABKEY,tab);
  if(push) history.pushState({tab},'');
  render();
}
function openModal(m,name){
  m.classList.add('open');
  history.pushState({tab:state.tab,modal:name},'');
}
function closeModal(m){
  if(m.classList.contains('open')) history.back();
}
function render(){
  processAutoPay();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='calendar') renderCalendar();
  else if(state.tab==='students') renderStudents();
  else if(state.tab==='classes') renderClasses();
  else renderFinance();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab,true));
window.addEventListener('popstate',e=>{
  closeAllModals();
  if(e.state?.tab){
    state.tab=e.state.tab; localStorage.setItem(TABKEY,state.tab); render();
  }
});
history.replaceState({tab:state.tab},'');

function processAutoPay(){
  const now=new Date();
  let changed=false;

  state.data.students.forEach(st=>{
    if(st.autoPay===false)return;

    // Для позначки ✓ використовуємо реальний пул внесених оплат.
    // Баланс у списку учнів рахується окремо: оплати мінус усі проведені заняття.
    let z=stats(st.id);
    let available=Math.max(0,z.received-z.spent);

    const eligible=state.data.lessons
      .filter(l=>l.studentId===st.id && !l.paid && lessonMoment(l)<=now)
      .sort((a,b)=>(a.date+(a.end||'')).localeCompare(b.date+(b.end||'')));

    eligible.forEach(l=>{
      const price=Number(l.price||0);
      if(price>0 && available>=price){
        l.paid=true;
        l.autoPaid=true;
        available-=price;
        changed=true;
      }
    });
  });

  if(changed)localStorage.setItem(KEY,JSON.stringify(state.data));
}
function lessonMoment(l){
  const d=fromIso(l.date), [h,m]=(l.end||l.start||'00:00').split(':').map(Number);
  d.setHours(h||0,m||0,0,0); return d;
}

function renderCalendar(){
  const week=state.week,end=addDays(week,6);
  document.getElementById('topbar').innerHTML=`
    <div><button id="todayBtn" style="border:0;background:transparent;padding:0;text-align:left"><div class="month">${MONTHS[week.getMonth()]}</div></button>
      <div class="weeknav"><button class="iconbtn" id="prevW">‹</button><span>${week.getDate()} – ${end.getDate()} ${GEN[end.getMonth()]}</span><button class="iconbtn" id="nextW">›</button></div>
    </div>
    <div><button class="fab" id="addEvent">+</button></div>`;
  document.getElementById('todayBtn').onclick=()=>{state.week=startWeek(new Date());render()};
  document.getElementById('prevW').onclick=()=>{state.week=addDays(state.week,-7);render()};
  document.getElementById('nextW').onclick=()=>{state.week=addDays(state.week,7);render()};
  document.getElementById('addEvent').onclick=()=>openEventChoice();

  let heads='<div class="timeHead"></div>';
  for(let i=0;i<7;i++){let d=addDays(week,i);heads+=`<div class="dayhead"><div class="n">${d.getDate()}</div><div class="d">${DAYS[i]}</div></div>`}
  let times='';for(let h=HSTART;h<HEND;h++) times+=`<div class="time">${h}</div>`;
  let cols='';
  for(let i=0;i<7;i++){
    const d=iso(addDays(week,i));
    let lines='';for(let h=HSTART;h<HEND;h++) lines+='<div class="hourline"></div>';
    const tutor=state.data.lessons.filter(l=>l.date===d).map(l=>{
      const st=student(l.studentId);if(!st)return '';
      const top=(mins(l.start)-HSTART*60)/60;
      const dur=Math.max(.35,(mins(l.end)-mins(l.start))/60);
      return `<button class="lesson" data-kind="tutor" data-id="${l.id}" style="top:calc(var(--hour) * ${top});height:calc(var(--hour) * ${dur} - 2px);background:${st.color}">
        <div class="name">${esc(st.name)}</div><div class="meta">${money(l.price)} <span class="paidmark">${l.paid?'✓':''}</span></div>
      </button>`
    }).join('');
    const school=state.data.schoolLessons.filter(l=>l.date===d).map(l=>{
      const cl=state.data.schoolClasses.find(c=>c.id===l.classId);
      const sub=cl?.subjects?.find(s=>s.id===l.subjectId);
      if(!cl||!sub)return '';
      const top=(mins(l.start)-HSTART*60)/60;
      const dur=Math.max(.35,(mins(l.end)-mins(l.start))/60);
      return `<button class="lesson school" data-kind="school" data-id="${l.id}" style="top:calc(var(--hour) * ${top});height:calc(var(--hour) * ${dur} - 2px);background:${sub.color||'#64748b'}">
        <div class="name">${esc(cl.name)} · ${esc(sub.name)}</div><div class="mode">${l.mode==='remote'?'💻 Дистанційно':'🏫 Очно'}</div>
      </button>`
    }).join('');
    cols+=`<div class="daycol" data-date="${d}">${lines}${tutor}${school}</div>`
  }
  document.getElementById('main').innerHTML=`<div class="calendarWrap"><div class="calendar"><div class="dayheads">${heads}</div><div class="gridrow"><div class="times">${times}</div>${cols}</div></div></div>`;
  document.querySelectorAll('.lesson[data-kind="tutor"]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTutorLesson(state.data.lessons.find(x=>x.id===b.dataset.id))});
  document.querySelectorAll('.lesson[data-kind="school"]').forEach(b=>b.onclick=e=>{e.stopPropagation();openSchoolLesson(state.data.schoolLessons.find(x=>x.id===b.dataset.id))});
  document.querySelectorAll('.daycol').forEach(col=>col.onclick=e=>{
    if(e.target.closest('.lesson'))return;
    const rect=col.getBoundingClientRect(), y=Math.max(0,Math.min(rect.height,e.clientY-rect.top));
    const minutesSpan=(HEND-HSTART)*60;
    const raw=HSTART*60 + (y/rect.height)*minutesSpan;
    const total=Math.round(raw/15)*15;
    const hh=pad(Math.floor(total/60)), mm=pad(total%60), endM=total+60;
    openEventChoice({date:col.dataset.date,start:`${hh}:${mm}`,end:`${pad(Math.floor(endM/60))}:${pad(endM%60)}`});
  });
}
function openEventChoice(preset={}){
  const m=document.getElementById('choiceModal');
  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">Що додати?</div></div>
  <div class="mbody"><div class="typeChoice">
    <button class="typeCard" id="chooseTutor"><span>👩‍🏫</span>Додати заняття</button>
    <button class="typeCard" id="chooseSchool"><span>🏫</span>Додати урок</button>
  </div></div>`;
  openModal(m,'choice');
  m.querySelector('.close').onclick=()=>closeModal(m);
  document.getElementById('chooseTutor').onclick=()=>{
    if(!state.data.students.length)return alert('Спочатку додай учня у вкладці «Учні».');
    m.classList.remove('open'); history.replaceState({tab:state.tab},''); openTutorLesson(null,preset);
  };
  document.getElementById('chooseSchool').onclick=()=>{
    if(!state.data.schoolClasses.length)return alert('Спочатку додай клас у вкладці «Класи».');
    m.classList.remove('open'); history.replaceState({tab:state.tab},''); openSchoolLesson(null,preset);
  };
}
function renderStudents(){
  document.getElementById('topbar').innerHTML='';
  let rows=state.data.students.map(st=>{
    const z=stats(st.id), bc=z.balance>0?'var(--good)':z.balance<0?'var(--bad)':'#555';
    return `<button class="studentRow" data-id="${st.id}">

function repeatUntilDefault(dateStr){
  const d=fromIso(dateStr); d.setMonth(d.getMonth()+6); return iso(d);
}
function repeatDates(startDate,untilDate){
  const out=[]; let d=fromIso(startDate), end=fromIso(untilDate);
  while(d<=end){out.push(iso(d));d=addDays(d,7)}
  return out;
}

function editTutorSeries(old,obj,parent){
  parent.classList.remove('open');history.replaceState({tab:state.tab},'');
  chooseSeries('Змінити повторюване заняття',scope=>{
    const items=state.data.lessons.filter(x=>x.seriesId===old.seriesId);
    if(scope==='one'){
      state.data.lessons=state.data.lessons.map(x=>x.id===old.id?{...obj,seriesId:null}:x);
    }else if(scope==='following'){
      const base=fromIso(obj.date), oldBase=fromIso(old.date);
      items.filter(x=>x.date>=old.date).forEach(x=>{
        const weeks=Math.round((fromIso(x.date)-oldBase)/(7*86400000));
        Object.assign(x,{studentId:obj.studentId,price:obj.price,start:obj.start,end:obj.end,note:obj.note,date:iso(addDays(base,weeks*7))});
        if(x.id===old.id){x.paid=obj.paid;x.autoPaid=obj.autoPaid}
      });
    }else{
      const delta=Math.round((fromIso(obj.date)-fromIso(old.date))/86400000);
      items.forEach(x=>{x.studentId=obj.studentId;x.price=obj.price;x.start=obj.start;x.end=obj.end;x.note=obj.note;x.date=iso(addDays(fromIso(x.date),delta))});
      const clicked=state.data.lessons.find(x=>x.id===old.id);if(clicked){clicked.paid=obj.paid;clicked.autoPaid=obj.autoPaid}
    }
    save();render();
  });
}
function editSchoolSeries(old,obj,parent){
  parent.classList.remove('open');history.replaceState({tab:state.tab},'');
  chooseSeries('Змінити повторюваний урок',scope=>{
    const items=state.data.schoolLessons.filter(x=>x.seriesId===old.seriesId);
    if(scope==='one'){
      state.data.schoolLessons=state.data.schoolLessons.map(x=>x.id===old.id?{...obj,seriesId:null}:x);
    }else if(scope==='following'){
      const base=fromIso(obj.date), oldBase=fromIso(old.date);
      items.filter(x=>x.date>=old.date).forEach(x=>{
        const weeks=Math.round((fromIso(x.date)-oldBase)/(7*86400000));
        Object.assign(x,{classId:obj.classId,subjectId:obj.subjectId,mode:obj.mode,start:obj.start,end:obj.end,note:obj.note,date:iso(addDays(base,weeks*7))});
      });
    }else{
      const delta=Math.round((fromIso(obj.date)-fromIso(old.date))/86400000);
      items.forEach(x=>{x.classId=obj.classId;x.subjectId=obj.subjectId;x.mode=obj.mode;x.start=obj.start;x.end=obj.end;x.note=obj.note;x.date=iso(addDays(fromIso(x.date),delta))});
    }
    save();render();
  });
}

  parent.classList.remove('open');history.replaceState({tab:state.tab},'');
  chooseSeries('Видалити повторюване заняття',scope=>{
    if(scope==='one')state.data.lessons=state.data.lessons.filter(x=>x.id!==l.id);
    if(scope==='following')state.data.lessons=state.data.lessons.filter(x=>!(x.seriesId===l.seriesId&&x.date>=l.date));
    if(scope==='all')state.data.lessons=state.data.lessons.filter(x=>x.seriesId!==l.seriesId);
    save();render();
  });
}
function deleteSchoolLesson(l,parent){
  if(!l.seriesId){
    if(confirm('Видалити цей урок?')){state.data.schoolLessons=state.data.schoolLessons.filter(x=>x.id!==l.id);save();finishModalSave(parent)}
    return;
  }
  parent.classList.remove('open');history.replaceState({tab:state.tab},'');
  chooseSeries('Видалити повторюваний урок',scope=>{
    if(scope==='one')state.data.schoolLessons=state.data.schoolLessons.filter(x=>x.id!==l.id);
    if(scope==='following')state.data.schoolLessons=state.data.schoolLessons.filter(x=>!(x.seriesId===l.seriesId&&x.date>=l.date));
    if(scope==='all')state.data.schoolLessons=state.data.schoolLessons.filter(x=>x.seriesId!==l.seriesId);
    save();render();
  });
}
function openStudent(st=null){
  const m=document.getElementById('studentModal'),pal=['#e11d48','#ec4899','#f43f5e','#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#c084fc','#d946ef','#a16207','#64748b','#334155','#fb7185','#2dd4bf'];
  let color=st?.color||'#8b5cf6';
  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">${st?'Редагування учня':'Додати учня'}</div>${st?'<button class="trash">🗑</button>':''}</div>
  <div class="mbody"><div><label>Ім’я</label><input id="sfName" value="${esc(st?.name||'')}"></div><div><label>Клас / примітка</label><input id="sfCls" value="${esc(st?.cls||'')}"></div><div><label>Стандартна ціна</label><input id="sfPrice" type="number" value="${st?.price||350}"></div>
  <div class="switchrow"><span><b>Автооплата з балансу</b><br><small style="color:var(--muted)">Оплачувати проведені заняття з передоплати</small></span><input id="sfAutoPay" type="checkbox" ${st?.autoPay===false?'':'checked'} style="width:auto;min-height:auto"></div>
  <div><label>Колір у календарі</label><div class="palette">${pal.map(c=>`<button class="c ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div></div><button class="primary" id="saveStudent">Зберегти</button></div>`;
  openModal(m,'student');m.querySelector('.close').onclick=()=>closeModal(m);
  m.querySelectorAll('.c').forEach(b=>b.onclick=()=>{color=b.dataset.c;m.querySelectorAll('.c').forEach(x=>x.classList.toggle('sel',x.dataset.c===color))});
  if(st)m.querySelector('.trash').onclick=()=>{if(confirm('Видалити учня разом із його заняттями та оплатами?')){state.data.students=state.data.students.filter(x=>x.id!==st.id);state.data.lessons=state.data.lessons.filter(x=>x.studentId!==st.id);state.data.payments=state.data.payments.filter(x=>x.studentId!==st.id);save();m.classList.remove('open');history.replaceState({tab:state.tab},'');render()}};
  document.getElementById('saveStudent').onclick=()=>{const obj={id:st?.id||uid(),name:document.getElementById('sfName').value.trim()||'Без імені',cls:document.getElementById('sfCls').value.trim(),price:Number(document.getElementById('sfPrice').value||0),color,autoPay:document.getElementById('sfAutoPay').checked};if(st)state.data.students=state.data.students.map(x=>x.id===st.id?obj:x);else state.data.students.push(obj);save();m.classList.remove('open');history.replaceState({tab:state.tab},'');render()};
}
function openCard(id){
  const st=student(id),z=stats(id),m=document.getElementById('cardModal');if(!st)return;
  const ps=[...z.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const ls=[...z.lessons].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)).slice(0,12);
  m.innerHTML=`<div class="mhead"><button class="close">×</button><div class="title">${esc(st.name)}</div><button id="editSt" style="border:0;background:transparent;color:var(--accent);font-weight:800">Редагувати</button></div>
  <div class="mbody"><div class="bigbal" style="color:${z.balance>0?'var(--good)':z.balance<0?'var(--bad)':'var(--text)'}">${z.balance>0?'+':''}${money(z.balance)}</div>
  <div class="summary" style="margin-top:-8px">${z.balance>0?'Передоплата':z.balance<0?'Борг':'Розраховано'}</div>
  <div class="section">Внести оплату</div><div><label>Сума</label><input id="payAmount" type="number" placeholder="1400"></div><div><label>Коментар</label><input id="payNote" placeholder="Напр. Mono, за вересень"></div><button class="primary" id="addPay">Додати оплату</button>
  <div class="section">Останні оплати</div>${ps.length?ps.map(p=>`<div class="history"><div><div class="h1">${esc(p.note||'Оплата')}</div><div class="h2">${fmt(p.date)}</div></div><b style="color:var(--good)">+${money(p.amount)}</b></div>`).join(''):'<div class="empty">Оплат ще немає</div>'}
  <div class="section">Останні заняття</div>${ls.length?ls.map(l=>`<div class="history"><div><div class="h1">${fmt(l.date)} · ${l.start}</div><div class="h2">${esc(l.note||'Заняття')}</div></div><b style="color:${l.paid?'var(--good)':'var(--bad)'}">${l.paid?'Оплачено':'Не оплачено'}</b></div>`).join(''):'<div class="empty">Занять ще немає</div>'}</div>`;
  openModal(m,'income');m.querySelector('.close').onclick=()=>closeModal(m);
  document.getElementById('editSt').onclick=()=>{m.classList.remove('open');openStudent(st)};
  document.getElementById('addPay').onclick=()=>{const a=Number(document.getElementById('payAmount').value||0);if(a<=0)return alert('Введи суму');state.data.payments.push({id:uid(),studentId:id,amount:a,date:iso(new Date()),note:document.getElementById('payNote').value.trim()});save();m.classList.remove('open');openCard(id);render()};
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; document.getElementById('installBar').classList.add('show');
});
document.getElementById('installNow').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBar').classList.remove('show');
};
document.getElementById('installClose').onclick=()=>document.getElementById('installBar').classList.remove('show');

normalizeData();
render();
</script>
</body>
</html>
